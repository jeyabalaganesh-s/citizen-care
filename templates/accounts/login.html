<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thaagam Foundation | Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff, #e0e7ff, #f8fafc);
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 35px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .brand-icon {
            width: 65px;
            height: 65px;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            margin: 0 auto 18px;
        }

        .brand-title {
            font-size: 23px;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
        }

        .brand-subtitle {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading {
            font-size: 20px;
            font-weight: 650;
            color: #1e293b;
            margin-bottom: 6px;
        }

        .login-description {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 14px;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .login-btn {
            height: 48px;
            border-radius: 9px;
            background: #4338ca;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s ease;
        }

        .login-btn:hover {
            background: #3730a3;
            transform: translateY(-1px);
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 11px 13px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="brand-icon">T</div>

            <h1 class="brand-title">Thaagam Foundation</h1>
            <p class="brand-subtitle">Administration Portal</p>

            <h2 class="login-heading">Welcome Back!</h2>
            <p class="login-description">Sign in to access your admin dashboard.</p>

            {% if form.errors %}
                <div class="error-message">
                    <strong>Login failed!</strong>
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">
                        Username
                    </label>
                    <input
                        type="text"
                        name="{{ form.username.html_name }}"
                        id="{{ form.username.id_for_label }}"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label class="form-label" for="{{ form.password.id_for_label }}">
                        Password
                    </label>
                    <input
                        type="password"
                        name="{{ form.password.html_name }}"
                        id="{{ form.password.id_for_label }}"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn login-btn w-100">
                    Sign In
                </button>

            </form>

            <p class="footer-text">
                &copy; 2026 Thaagam Foundation. All rights reserved.
            </p>

        </div>

    </div>

</body>
</html>
